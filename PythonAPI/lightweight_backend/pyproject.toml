[project]
name = "carla-marine-lightweight-backend"
version = "0.0.0"
description = "Non-Unreal CARLA-protocol backend, viewer and tests for the marine vessel fork"
requires-python = ">=3.12,<3.13"
dependencies = [
    "carla",
    "msgpack>=1.0",
    "numpy",
    "matplotlib",
]

# The `carla` client wheel is built locally (see MarineDocs/setup.md), outside the repository.
# This path assumes the build directory `build-client` next to the repository checkout and a
# cp312 wheel; adjust it (and `requires-python`) if yours differs.
[tool.uv.sources]
carla = { path = "../../../build-client/PythonAPI/dist/carla-0.10.0-cp312-cp312-linux_x86_64.whl" }

[tool.uv]
package = false
